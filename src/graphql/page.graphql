query Page($locale: SiteLocale, $fallbackLocale: [SiteLocale!], $slug: String) {
  page(
    filter: { slug: { eq: $slug } }
    locale: $locale
    fallbackLocales: $fallbackLocale
  ) {
    id
    label
    abstract
    _modelApiKey
    slugs: _allSlugLocales {
      locale
      value
    }
    isIndex
    isHome
    seo: _seoMetaTags {
      ...seoMetaFragment
    }
    hero {
      link {
        ... on InternalLinkRecord {
          ...internalLink
        }
        ... on ExternalLinkRecord {
          ...externalLink
        }
      }
      _modelApiKey
      id
      heroSubtitle
      heroTitle
      displayOptions
      heroImage {
        responsiveImage {
          ...rImage
        }
      }
    }
    sections {
      ... on SectionWrapRecord {
        id
        label
        _modelApiKey
        title
        style
        blocks {
          ...wrapSectionBlocks
        }
      }
    }
  }
}
