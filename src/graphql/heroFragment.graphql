fragment heroFragment on HeroSectionRecord {
  link {
    ... on InternalLinkRecord {
      ...internalLink
    }
    ... on ExternalLinkRecord {
      ...externalLink
    }
  }
  _modelApiKey
  id
  heroSubtitle
  heroTitle
  displayOptions
  heroImage {
    responsiveImage {
      ...rImage
    }
  }
  sliders {
    id
    title
    text
    image {
      responsiveImage(
        imgixParams: { auto: format, ar: "4:3", fit: crop, h: 720 }
      ) {
        ...rImage
      }
    }
  }
}
